apiVersion: backstage.io/v1alpha1
kind: Component

metadata:
  name:  DSSP-TargetP-19
  description: Service  DSSP-TargetP-19

  annotations:
    github.com/project-slug: BackstageSSPPoC/ DSSP-TargetP-19
    backstage.io/techdocs-ref: dir:.
    jenkins.io/job-full-name: Backstage_SSP_PoC/DSSP-TargetP-19/main
    argocd/app-name:  dssp-targetp-19-dev
    backstage.io/kubernetes-id:  DSSP-TargetP-19
    sonarqube.org/project-key:  dssp-targetp-19
    prometheus.io/rule: "kube_pod_container_resource_requests{pod=~'dssp-targetp-19.*'}|resource,kube_pod_container_status_restarts_total{pod=~'dssp-targetp-19.*'}|container"
    prometheus.io/alert: "KubePodCrashLooping,KubeDeploymentReplicasMismatch,KubePodNotReady,KubeContainerWaiting,KubeContainerOOMKilled,KubeDeploymentRolloutStuck"
    prometheus.io/labels: "namespace=dev"

spec:
  type: service
  owner: development
  lifecycle: experimental

